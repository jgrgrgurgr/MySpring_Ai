name: myspring-ai-server
app: python@3.9
options:
  env:
    - name: FLASK_ENV
      value: production
  ports: 5000
  start: gunicorn -w 2 --timeout 120 --preload app:app
  health-check:
    path: /healthz
    interval: 10
    timeout: 5

services:
  face-stroke:
    path: ./Face_Stroke
    build:
      type: python
      python_version: "3.9"
    env:
      - name: FLASK_ENV
        value: production
    run:
      command: gunicorn -w 2 --timeout 120 --preload Face_Whether_Stroke:app
    routes:
      - path: /face
    health-check:
      path: /healthz
      interval: 10
      timeout: 5

  pose-stroke:
    path: ./Pose_Stroke
    build:
      type: python
      python_version: "3.9"
    env:
      - name: FLASK_ENV
        value: production
    run:
      command: gunicorn -w 2 --timeout 120 --preload Arm_Whether_Stroke:app
    routes:
      - path: /pose
    health-check:
      path: /healthz
      interval: 10
      timeout: 5