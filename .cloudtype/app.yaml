services:
  face-stroke:
    path: ./Face_Stroke
    build:
      type: python
      python_version: "3.9"
    env:
      - name: FLASK_ENV
        value: production
    run:
      command: gunicorn -w 2 --timeout 120 --preload Face_Whether_Stroke:app
    routes:
      - path: /face

  pose-stroke:
    path: ./Pose_Stroke
    build:
      type: python
      python_version: "3.9"
    env:
      - name: FLASK_ENV
        value: production
    run:
      command: gunicorn -w 2 --timeout 120 --preload Arm_Whether_Stroke:app
    routes:
      - path: /pose

context:
  git:
    url: https://github.com/stroke-of-the-brain/ai
    branch: juyoung
